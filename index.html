    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f4f2fb;
        --card: #fff;
        --ink: #1d1b36;
        --mut: #5d5b78;
        --ln: #dcd8ee;
        --prithvi: #a0692a;
        --jala: #14839f;
        --agni: #c93d12;
        --vayu: #2f8553;
        --akasha: #6150c4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #13142b;
          --card: #1d1f3f;
          --ink: #ecebff;
          --mut: #a9a7cc;
          --ln: #3a3c75;
        }
      }
      :root[data-theme="dark"] {
        --bg: #13142b;
        --card: #1d1f3f;
        --ink: #ecebff;
        --mut: #a9a7cc;
        --ln: #3a3c75;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Mukta, "Mukta Malar", system-ui, sans-serif;
      }
      .f {
        font-family: "Yatra One", "Mukta Malar", Georgia, serif;
        font-weight: 400;
      }
      .btn {
        background: var(--akasha);
        color: #fff;
        padding: 0.6rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 800;
      }
      .btn2 {
        border: 2px solid var(--ln);
        padding: 0.45rem 1rem;
        border-radius: 0.7rem;
        font-weight: 600;
      }
      .inp {
        background: var(--bg);
        color: var(--ink);
        border: 2px solid var(--ln);
        border-radius: 0.6rem;
        padding: 0.5rem 0.75rem;
        font-size: 1.25rem;
      }
      .inp:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--akasha);
        outline-offset: 2px;
      }
      .gb:hover {
        background: var(--bg);
      }
      .tab {
        padding: 0.6rem 1.1rem;
        font-weight: 800;
        border-bottom: 3px solid transparent;
        margin-bottom: -1px;
      }
      .tab[aria-selected="true"] {
        border-color: var(--akasha);
      }
      .tile {
        aspect-ratio: 1;
        background: var(--ln);
        border-radius: 0.6rem;
      }
      .tile.lit {
        background: var(--prithvi);
      }
      .tile.ok {
        background: var(--vayu);
      }
      .tile.bad {
        background: var(--agni);
      }
      .opt {
        padding: 0.8rem;
        border: 2px solid var(--ln);
        border-radius: 0.7rem;
        font-weight: 600;
        font-size: 1.1rem;
      }
      .opt.ok,
      .card.ok {
        background: var(--vayu);
        color: #fff;
        border-color: var(--vayu);
      }
      .opt.bad {
        background: var(--agni);
        color: #fff;
        border-color: var(--agni);
      }
      .card {
        aspect-ratio: 3/4;
        background: var(--jala);
        border-radius: 0.6rem;
        color: transparent;
        font-size: 0.8rem;
        font-weight: 800;
        padding: 0;
      }
      .card.up {
        background: var(--card);
        border: 2px solid var(--jala);
        color: var(--ink);
      }
      .arena {
        position: relative;
        background: var(--bg);
        border: 2px dashed var(--ln);
        border-radius: 0.8rem;
        overflow: hidden;
      }
      .spark {
        position: absolute;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--agni);
        box-shadow: 0 0 18px 6px #f59e0b;
      }
      .star {
        position: absolute;
        width: 15px;
        height: 15px;
        background: #e8a900;
        clip-path: polygon(
          50% 0,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
      }
      .pad {
        aspect-ratio: 1;
        border-radius: 1rem;
        opacity: 0.5;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .pad.on {
        opacity: 1;
        transform: scale(1.05);
      }
      .p0 {
        background: var(--prithvi);
      }
      .p1 {
        background: var(--jala);
      }
      .p2 {
        background: var(--agni);
      }
      .p3 {
        background: var(--vayu);
      }
      body {
        -webkit-user-select: none;
        user-select: none;
      }
      input,
      select {
        -webkit-user-select: text;
        user-select: text;
      }
      button {
        touch-action: manipulation;
      }
      .tab,
      .btn,
      .btn2 {
        min-height: 44px;
      }
      .card {
        font-size: clamp(0.6rem, 2.8vw, 0.8rem);
        overflow: hidden;
        overflow-wrap: anywhere;
        line-height: 1.1;
      }
      @media (max-width: 380px) {
        .opt {
          font-size: 1rem;
          padding: 0.7rem 0.4rem;
        }
        .tile {
          border-radius: 0.4rem;
        }
      }
      @keyframes sk {
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
      .shake {
        animation: sk 0.3s;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      nav{backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 88%,transparent)!important}
      nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--prithvi) 20%,var(--jala) 20% 40%,var(--agni) 40% 60%,var(--vayu) 60% 80%,var(--akasha) 80%)}
      #hd h1{background:linear-gradient(100deg,var(--agni),var(--akasha) 55%,var(--jala));-webkit-background-clip:text;background-clip:text;color:transparent}
      #hd input,#hd select{background:var(--card)}
      .btn{box-shadow:0 4px 0 color-mix(in srgb,var(--akasha) 55%,#000);transition:transform .1s,box-shadow .1s}
      .btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--akasha) 55%,#000)}
      .btn2{transition:background .15s}.btn2:hover{background:var(--bg)}
      .stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.25rem}
      .stats span{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:.3rem .9rem;color:var(--mut)}
      .stats b{color:var(--ink);font-size:1.15rem}
      .chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
      .chip{border:2px solid var(--c);border-radius:999px;padding:.3rem 1rem;font-weight:800;min-height:40px;color:var(--ink)}
      .chip[aria-pressed="true"]{background:var(--c);color:#fff}
      main section{margin-top:1.75rem}
      .eh{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem;padding-left:.75rem;border-left:6px solid var(--c)}
      .eh span:last-child{color:var(--mut)}
      .gc{position:relative;text-align:left;padding:1.1rem;background:var(--card);border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:1rem;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
      .gc:hover{transform:translateY(-4px);box-shadow:0 10px 24px -10px var(--c)}
      .gc .ic{width:2.8rem;height:2.8rem;display:grid;place-items:center;font-size:1.5rem;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,transparent)}
      .gc .bd{position:absolute;top:.9rem;right:.9rem;font-size:.8rem;font-weight:800;color:var(--c)}
      .gc .pl{margin-top:auto;padding-top:.8rem;font-weight:800;color:var(--c)}
      .clamp{color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
      #st>div{position:relative;animation:pop .22s ease-out}
      @keyframes pop{from{transform:scale(.94);opacity:0}}
      .tbar{height:6px;border-radius:9px;background:var(--ln);margin-top:1rem;overflow:hidden}
      .tbar i{display:block;height:100%;width:0;background:var(--akasha);transition:width 1s linear}
      .opt{background:var(--bg);transition:transform .1s,border-color .15s}.opt:hover:not(:disabled){border-color:var(--akasha);transform:translateY(-2px)}
      .bub{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--vayu);color:#fff;font-weight:800;font-size:1.2rem}
      .bub.gone{opacity:.15}
      .cf{position:absolute;top:0;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards;pointer-events:none}
      @keyframes fall{to{transform:translate(var(--x),420px) rotate(540deg);opacity:0}}
      #lbt tr.me{background:color-mix(in srgb,var(--akasha) 14%,transparent)}
      #lbt td{padding:.55rem .4rem}

      /* ===== theme v2: yantra shapes, sticker cards ===== */
      :root{--bg:#e9f1ee;--card:#fff;--ink:#17203a;--mut:#4b5870;--ln:#b9cdc6;--edge:#17203a;--pop:#ffcf40;--on:#fff;--prithvi:#b86e12;--jala:#0b7fa0;--agni:#d83a14;--vayu:#2a8a5a;--akasha:#5b49c9}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a2a;--card:#15273d;--ink:#eaf3f0;--mut:#9fb3c6;--ln:#2a435e;--edge:#6f93b0;--on:#0d1a2a;--prithvi:#e0902c;--jala:#2bb0d4;--agni:#ff6a3d;--vayu:#44c283;--akasha:#9a8cff}}
      :root[data-theme="dark"]{--bg:#0d1a2a;--card:#15273d;--ink:#eaf3f0;--mut:#9fb3c6;--ln:#2a435e;--edge:#6f93b0;--on:#0d1a2a;--prithvi:#e0902c;--jala:#2bb0d4;--agni:#ff6a3d;--vayu:#44c283;--akasha:#9a8cff}
      body{font-family:Hind,"Hind Madurai",system-ui,sans-serif;font-size:1.05rem;background-image:radial-gradient(color-mix(in srgb,var(--ink) 12%,transparent) 1px,transparent 1.6px);background-size:22px 22px}
      .f{font-family:"Rozha One",Georgia,serif}
      nav{border-bottom:2px solid var(--edge)!important;background:var(--card)!important}
      #hd h1{background:none;-webkit-text-fill-color:var(--ink);color:var(--ink);text-shadow:4px 4px 0 var(--pop)}
      .sp{display:inline-block;flex:none;width:2.2rem;height:2.2rem;background:var(--c)}
      .sp-prithvi{--c:var(--prithvi);clip-path:inset(6%)}
      .sp-jala{--c:var(--jala);clip-path:circle(47%)}
      .sp-agni{--c:var(--agni);clip-path:polygon(50% 4%,98% 92%,2% 92%)}
      .sp-vayu{--c:var(--vayu);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
      .sp-akasha{--c:var(--akasha);clip-path:circle(48%);-webkit-mask:radial-gradient(circle,transparent 36%,#000 38%);mask:radial-gradient(circle,transparent 36%,#000 38%)}
      .yantra{display:flex;gap:.7rem;margin-bottom:1rem}
      .yantra .sp{width:2.6rem;height:2.6rem;animation:drop .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i)*110ms)}
      @keyframes drop{from{transform:translateY(-30px) scale(.5);opacity:0}}
      .cd{animation:pop .5s ease-out}
      .eh{border-left:0;padding-left:0;align-items:center}.eh .sp{width:1.9rem;height:1.9rem}
      .btn{background:var(--pop);color:#17203a;border:2px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
      .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
      .btn2,.inp{border:2px solid var(--edge)}
      .btn2{background:var(--card)}
      .tab[aria-selected="true"]{border-color:var(--agni)}
      .stats span{border:2px solid var(--edge)}
      .chip{border:2px solid var(--edge);background:var(--card);box-shadow:3px 3px 0 var(--c)}
      .chip[aria-pressed="true"]{background:var(--c);color:var(--on)}
      .gc{border:2px solid var(--edge);box-shadow:5px 5px 0 var(--c);border-radius:.9rem}
      .gc:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--c)}
      .gc .ic{border-radius:.7rem;border:2px solid var(--edge);background:color-mix(in srgb,var(--c) 22%,var(--card))}
      #st>div{border:2px solid var(--edge);box-shadow:8px 8px 0 var(--c,var(--akasha));border-radius:1.1rem}
      .tbar{border:2px solid var(--edge);height:10px}.tbar i{background:var(--c,var(--akasha))}
      .opt{border:2px solid var(--edge);background:var(--card)}
      .opt:hover:not(:disabled){background:var(--pop);color:#17203a;border-color:var(--edge)}
      .opt.ok,.opt.bad,.card.ok{color:var(--on)}
      .arena{border-color:var(--edge)}
      table{border-collapse:separate;border-spacing:0 .5rem}
      #lbt tr{border:0!important}
      #lbt td{background:var(--card);border-top:2px solid var(--edge);border-bottom:2px solid var(--edge)}
      #lbt td:first-child{border-left:2px solid var(--edge);border-radius:.7rem 0 0 .7rem;padding-left:.7rem}
      #lbt td:last-child{border-right:2px solid var(--edge);border-radius:0 .7rem .7rem 0;padding-right:.8rem}
      #lbt tr.me td{background:color-mix(in srgb,var(--pop) 35%,var(--card))}
      :focus-visible{outline:3px solid var(--agni)!important;outline-offset:2px}

      /* ===== 3D layer ===== */ 
      #hd,#gm,#lbs{position:relative;z-index:1}
      #hd h1{text-shadow:3px 3px 0 var(--pop),6px 6px 0 color-mix(in srgb,var(--akasha) 70%,transparent)}
      .gc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.45),transparent 55%)}
      .gc:hover::after{opacity:1}
      .opt{box-shadow:0 5px 0 var(--edge)}
      .opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
      .tile{box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .1s,box-shadow .1s}
      .tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
      .pad{box-shadow:0 6px 0 rgba(0,0,0,.3)}.pad.on{transform:scale(1.05) translateY(-4px)}
      .bub{background:radial-gradient(circle at 30% 28%,color-mix(in srgb,#fff 45%,var(--vayu)),var(--vayu) 62%);box-shadow:0 5px 0 rgba(0,0,0,.3)}
      .bub:active{transform:translateY(3px)}

      /* element emblems replace the flat glyph shapes */
      .sp{background:none!important;clip-path:none!important;-webkit-mask:none!important;mask:none!important;display:grid;place-items:center;font-style:normal;font-size:1.7rem;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
      .yantra .sp{font-size:2.4rem}
      .sp-prithvi::before{content:"🌍"}.sp-jala::before{content:"💧"}.sp-agni::before{content:"🔥"}.sp-vayu::before{content:"🌪️"}.sp-akasha::before{content:"🌌"}

      /* ===== theme v3: calmer, one focal point =====
         Bold moment = the hero title. Everything else is quieter. */
      :root{--bg:#f3f6f4;--ln:#cfdcd6;--r:14px}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1624}}
      :root[data-theme="dark"]{--bg:#0b1624}
      body{background-image:none;background-attachment:fixed;
        background-image:radial-gradient(900px 500px at 85% -5%,color-mix(in srgb,var(--akasha) 14%,transparent),transparent 70%),
                         radial-gradient(700px 420px at -5% 30%,color-mix(in srgb,var(--jala) 12%,transparent),transparent 70%)} 

      /* nav: lighter, single hairline in the five element colours */
      nav{border-bottom:0!important}
      nav::after{height:4px}
      .tab{border-bottom-width:4px;border-radius:8px 8px 0 0}
      .tab[aria-selected="true"]{background:color-mix(in srgb,var(--akasha) 10%,transparent);border-color:var(--akasha)}

      /* hero: big title, simple shadow, spacious */
      #hd{padding-top:3rem;padding-bottom:2rem}
      #hd h1{transform:none;letter-spacing:-.01em;
        text-shadow:3px 3px 0 var(--pop),6px 6px 0 color-mix(in srgb,var(--akasha) 70%,transparent)}
      #hd>p[data-i="sub"]{font-size:1.2rem;max-width:34rem;line-height:1.5}
      .yantra .sp{width:3rem;height:3rem;font-size:2.2rem;filter:none}

      /* name / class / section sit together as one tidy panel */
      #hd .mt-6{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);
        padding:1rem 1.1rem;box-shadow:5px 5px 0 var(--pop);display:inline-flex;max-width:100%}
      .inp{border-width:2px;font-size:1.1rem}

      /* stats + chips: quieter */
      .stats span{border:1px solid var(--ln);background:transparent}
      .chip{box-shadow:none;border:2px solid var(--c);min-height:38px;padding:.2rem .9rem;font-weight:700}
      .chip[aria-pressed="true"]{box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000)}

      /* element headings: icon + name, no extra noise */
      main section{margin-top:2.5rem}
      .eh{gap:.6rem;border-bottom:2px solid var(--ln);padding-bottom:.6rem;margin-bottom:1rem}
      .eh .f{font-size:1.9rem;line-height:1}
      .eh b{font-size:1.15rem}
      .eh span:last-child{margin-left:auto;font-size:.9rem}

      /* game cards: flat, readable, one accent each; no 3D tilt on children */
      .gc{transform:none!important;border:2px solid var(--edge);border-top:6px solid var(--c);
        box-shadow:0 4px 0 var(--edge);border-radius:var(--r);padding:1rem 1.1rem;
        transition:transform .15s,box-shadow .15s,background .15s}
      .gc:hover{transform:translateY(-3px)!important;box-shadow:0 7px 0 var(--c);background:color-mix(in srgb,var(--c) 6%,var(--card))}
      .gc:active{transform:translateY(2px)!important;box-shadow:0 2px 0 var(--edge)}
      .gc .ic,.gc .f,.gc .bd{transform:none}
      .gc::after{display:none}
      .gc .ic{width:2.6rem;height:2.6rem;border:0;font-size:1.4rem;border-radius:50%}
      .gc .f{font-size:1.4rem;line-height:1.15}
      .gc .bd{background:var(--c);color:var(--on);border-radius:999px;padding:.05rem .55rem;top:.8rem;right:.8rem}
      .gc .pl{font-size:.95rem}

      /* game window + options: keep sticker feel, drop the heavy offsets */
      #st>div{box-shadow:6px 6px 0 var(--c,var(--akasha));animation:pop .25s ease-out}
      .opt{box-shadow:0 4px 0 var(--edge);border-radius:12px}

      /* leaderboard: top 3 get quiet medals */
      #lbs h2{font-size:2.6rem}
      #lbt tr:nth-child(1) td:first-child{color:#b8860b;font-weight:800}
      #lbt td{padding:.7rem .5rem}

      @media (max-width:640px){
        #hd{padding-top:1.5rem}
        #hd .mt-6{display:flex;width:100%}
        .eh span:last-child{display:none}
        main section{margin-top:1.75rem}
      }

      /* app feel */
      html{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
    
/* ===== v4 professional theme ===== */
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#5b6478;--ln:#e3e8f2;--edge:#e3e8f2;--pop:#f5b83d;--on:#fff;--r:18px;--brand:#4f46e5;--prithvi:#b7791f;--jala:#0891b2;--agni:#e0431f;--vayu:#16a06a;--akasha:#5b5bd6;--sh:0 1px 2px rgba(15,23,42,.06),0 10px 28px -14px rgba(15,23,42,.22)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#121a2e;--ink:#eef2fb;--mut:#9aa7c0;--ln:#222d48;--edge:#222d48;--on:#0a1020;--prithvi:#e3a13a;--jala:#38bdf8;--agni:#ff7a52;--vayu:#3dd68c;--akasha:#9b9bff;--brand:#818cf8;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.65)}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#121a2e;--ink:#eef2fb;--mut:#9aa7c0;--ln:#222d48;--edge:#222d48;--on:#0a1020;--prithvi:#e3a13a;--jala:#38bdf8;--agni:#ff7a52;--vayu:#3dd68c;--akasha:#9b9bff;--brand:#818cf8;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.65)}
html{scroll-behavior:smooth}
body{font-family:Inter,Hind,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;font-size:1rem;background-image:radial-gradient(800px 420px at 90% -8%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 70%),radial-gradient(600px 380px at -8% 35%,color-mix(in srgb,var(--jala) 12%,transparent),transparent 70%)!important;background-attachment:fixed;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));transition:background-color .3s,color .3s}
button{transition:transform .12s,background .2s,box-shadow .2s,border-color .2s}button:active:not(:disabled){transform:scale(.97)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:9px}
nav{background:color-mix(in srgb,var(--card) 80%,transparent)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
nav::after{height:3px;opacity:.9}
.tab{border-radius:10px!important;border-bottom:0!important;margin:6px 2px;color:var(--mut)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--brand) 14%,transparent)!important;color:var(--brand)}
.btn{background:linear-gradient(135deg,var(--brand),var(--akasha))!important;color:#fff!important;border:0!important;border-radius:14px!important;box-shadow:0 10px 22px -10px var(--brand)!important;letter-spacing:.01em}
.btn:active{box-shadow:0 4px 10px -6px var(--brand)!important;transform:scale(.97)!important}
.btn2,.inp{border:1px solid var(--ln)!important;border-radius:12px!important;background:var(--card)}
.inp:focus{border-color:var(--brand)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);outline:0!important}
:focus-visible{outline:2px solid var(--brand)!important;outline-offset:2px}
#hd{padding-top:1.6rem!important;animation:vin .5s ease both}
#hd h1{background:linear-gradient(100deg,var(--brand),var(--jala) 60%,var(--vayu))!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;color:transparent!important;text-shadow:none!important}
#hd .mt-6{box-shadow:var(--sh)!important;border:1px solid var(--ln)!important;border-radius:var(--r)!important}
.hi{font-weight:700;color:var(--mut);margin-bottom:.4rem;font-size:1.05rem}
.yantra .sp{font-size:1.9rem!important;width:2.6rem!important;height:2.6rem!important}
.stats span{background:var(--card)!important;border:1px solid var(--ln)!important;box-shadow:var(--sh)}
.chip{box-shadow:none!important;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--ln))!important;background:var(--card)}
.chip[aria-pressed="true"]{background:var(--c)!important;color:var(--on)!important;box-shadow:0 8px 16px -8px var(--c)!important}
.eh{border-bottom:1px solid var(--ln)!important}
.gc{border:1px solid var(--ln)!important;border-top:1px solid var(--ln)!important;border-radius:var(--r)!important;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 11%,var(--card)),var(--card) 60%)!important;box-shadow:var(--sh)!important;overflow:hidden;animation:vin .45s ease both}
.gc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.gc:hover{transform:translateY(-4px)!important;box-shadow:0 18px 34px -16px var(--c)!important}
.gc:active{transform:scale(.98)!important;box-shadow:var(--sh)!important}
.gc .ic{border:0!important;border-radius:14px!important}
.gc .pl::after{content:" →"}
#st{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(8,12,28,.6)!important}
#st>div{border:1px solid var(--ln)!important;border-radius:26px!important;box-shadow:0 30px 70px -20px rgba(0,0,0,.55)!important;animation:sup .3s cubic-bezier(.2,.9,.3,1)!important}
.opt{border:1px solid var(--ln)!important;border-radius:14px!important;background:var(--card)!important;box-shadow:0 2px 0 var(--ln)!important}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--brand) 10%,var(--card))!important;border-color:var(--brand)!important;color:var(--ink)!important}
.opt.ok{background:var(--vayu)!important;border-color:var(--vayu)!important;color:#fff!important}.opt.bad{background:var(--agni)!important;border-color:var(--agni)!important;color:#fff!important}
.tbar{border:0!important;background:var(--ln)!important;height:8px!important}.tbar i{border-radius:9px;background:linear-gradient(90deg,var(--c,var(--brand)),var(--akasha))!important}
.arena{border:1px dashed var(--ln)!important;border-radius:16px!important}
#lbt td{border-color:var(--ln)!important}#lbt tr:nth-child(-n+3) td{background:color-mix(in srgb,var(--pop) 14%,var(--card))}
#lbt tr.me td{background:color-mix(in srgb,var(--brand) 14%,var(--card))!important}
#lbs h2{font-size:2.2rem!important}
#au{background:radial-gradient(700px 420px at 80% 0,color-mix(in srgb,var(--brand) 22%,transparent),transparent 70%),var(--bg)!important}
#aform{border:1px solid var(--ln)!important;border-radius:26px!important;box-shadow:var(--sh);animation:sup .5s ease both}
.pwrap{position:relative}.pwrap .inp{padding-right:3rem}.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%)!important;padding:.4rem .6rem;min-height:36px;opacity:.7}
@keyframes vin{from{opacity:0;transform:translateY(12px)}}@keyframes sup{from{opacity:0;transform:translateY(24px) scale(.97)}}
/* boot splash */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(600px 400px at 50% 30%,color-mix(in srgb,var(--brand) 24%,transparent),transparent 70%),var(--bg);transition:opacity .5s,visibility .5s}
#boot.out{opacity:0;visibility:hidden}
#boot .bw{text-align:center;animation:vin .6s ease both}
#boot img{width:96px;height:96px;object-fit:contain;margin:0 auto .6rem;animation:flt 2.4s ease-in-out infinite}
#boot h1{font-family:"Rozha One",Georgia,serif;font-size:3.4rem;line-height:1;margin:0;background:linear-gradient(100deg,var(--brand),var(--jala) 60%,var(--vayu));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#boot p{color:var(--mut);margin:.4rem 0 1.2rem;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;font-weight:700}
#boot .e5{display:flex;gap:.55rem;justify-content:center;margin-bottom:1.3rem}#boot .e5 i{width:11px;height:11px;border-radius:50%;background:var(--c);animation:bnc 1s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
#boot .bp{width:180px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto;overflow:hidden}#boot .bp i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--brand),var(--vayu));animation:ld 1.7s cubic-bezier(.4,0,.2,1) forwards}
@keyframes bnc{50%{transform:translateY(-8px)}}@keyframes flt{50%{transform:translateY(-6px)}}@keyframes ld{to{width:100%}}
/* bottom bar, sheet, toast */
#bb{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:space-around;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln)}
#bb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:.72rem;font-weight:700;color:var(--mut)}
#bb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bb button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
#gear{display:none}
@media(max-width:767px){nav [role="tablist"],nav .ml-auto>:not(#gear):not(#mnb){display:none!important}#gear{display:inline-flex!important}nav .max-w-5xl{flex-wrap:nowrap}}
@media(min-width:768px){#bb{display:none}body{padding-bottom:1rem}}
#sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,12,28,.55);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#sheet.on{opacity:1;visibility:visible}
#sheet .pn{width:100%;max-width:30rem;max-height:90%;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:1.2rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
#sheet.on .pn{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 1rem}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,var(--brand),var(--vayu));flex:none}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0}.kp div{background:var(--bg);border-radius:14px;padding:.7rem .4rem;text-align:center;font-size:.78rem;color:var(--mut)}.kp b{display:block;font-size:1.4rem;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0;border-top:1px solid var(--ln);font-weight:600}
.sw{width:50px;height:30px;border-radius:99px;background:var(--ln);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}.sw.on{background:var(--vayu)}.sw.on::after{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;max-width:90%;padding:.7rem 1.1rem;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}

.f{font-family:"Rozha One","Hind Madurai",Georgia,serif}
#hd h1{font-size:clamp(2.6rem,12vw,5.5rem)!important;line-height:1.2!important;overflow-wrap:anywhere}
#aform h1{font-size:clamp(1.9rem,9vw,2.6rem)!important;line-height:1.25!important}
#boot h1{font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.25}
body.lk #hd .mt-6{display:none!important}
#md,#op{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto;background:radial-gradient(700px 420px at 85% 0,color-mix(in srgb,var(--agni) 20%,transparent),transparent 70%),radial-gradient(700px 420px at 10% 100%,color-mix(in srgb,var(--jala) 24%,transparent),transparent 70%),var(--bg);transition:opacity .45s,visibility .45s}
#op{z-index:8900}#md.out,#op.out{opacity:0;visibility:hidden}
.mw{width:100%;max-width:36rem;text-align:center}.mw h1{font-size:clamp(2.2rem,10vw,3.4rem);line-height:1.25;margin:0;background:linear-gradient(100deg,var(--agni),var(--akasha) 50%,var(--jala));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem}@media(max-width:520px){.mc{grid-template-columns:1fr}}
.mk{text-align:center;padding:1.4rem 1rem 1.3rem;border-radius:26px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 18%,var(--card)),var(--card) 70%);border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--ln));box-shadow:0 18px 40px -22px var(--c);color:var(--ink)}
.mk:hover{transform:translateY(-4px);box-shadow:0 26px 48px -20px var(--c)}.mk b{display:block;font-size:1.4rem;margin-top:.7rem;color:var(--c)}.mk span{display:block;color:var(--mut);font-size:.88rem;margin-top:.3rem;line-height:1.45}
.orb{display:grid;place-items:center;width:96px;height:96px;margin:0 auto;border-radius:50%;font-style:normal;font-size:3.2rem;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);animation:orb 2.4s ease-in-out infinite}
#mf .orb{animation-name:flame;animation-duration:1.3s}
@keyframes orb{50%{transform:translateY(-7px) scale(1.06)}}@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}35%{transform:scale(1.1,1.18) rotate(3deg)}70%{transform:scale(.97,1.06) rotate(-2deg)}}
.mp{display:inline-block;margin-left:.3rem;padding:.12rem .65rem;border-radius:99px;font-weight:800;font-size:.78rem;color:var(--c);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}

/* ===== v5 effects ===== */
html{--m1:rgba(155,155,255,.38);--m2:rgba(56,189,248,.3);--m3:rgba(61,214,140,.24)}
html[data-mode="on"]{--m1:rgba(255,106,61,.42);--m2:rgba(251,191,36,.3);--m3:rgba(244,63,94,.26)}
html[data-mode="off"]{--m1:rgba(34,211,238,.4);--m2:rgba(99,102,241,.32);--m3:rgba(56,189,248,.28)}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(38% 38% at 20% 25%,var(--m1),transparent 70%),radial-gradient(34% 34% at 80% 30%,var(--m2),transparent 70%),radial-gradient(42% 42% at 55% 90%,var(--m3),transparent 70%);filter:blur(36px);opacity:.6;animation:aur 22s ease-in-out infinite alternate;transition:background 1s}
@keyframes aur{to{transform:translate(6%,4%) rotate(8deg) scale(1.12)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
html[data-mode="on"] #hd h1{background-image:linear-gradient(100deg,#ff6a3d,#fbbf24 50%,#f43f5e)!important}
html[data-mode="off"] #hd h1{background-image:linear-gradient(100deg,#22d3ee,#6366f1 55%,#38bdf8)!important}
#hd h1{background-size:230% 100%!important;animation:shim 5s ease-in-out infinite alternate}
@keyframes shim{to{background-position:100% 0}}
.yantra .sp{animation:drop .6s cubic-bezier(.3,1.4,.5,1) both,bob 3.2s ease-in-out infinite!important;animation-delay:calc(var(--i)*110ms),calc(var(--i)*260ms + .7s)!important;cursor:pointer}
.yantra .sp:hover{transform:scale(1.3) rotate(-10deg)}@keyframes bob{50%{transform:translateY(-7px)}}
.msw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;margin:0 0 1rem;border-radius:99px;background:color-mix(in srgb,var(--card) 72%,transparent);border:1px solid var(--ln);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--sh)}
.msw::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:linear-gradient(135deg,var(--agni),#fbbf24);box-shadow:0 8px 22px -6px var(--agni);transition:transform .5s cubic-bezier(.3,1.4,.5,1),background .4s,box-shadow .4s}
.msw[data-m="off"]::before{transform:translateX(100%);background:linear-gradient(135deg,var(--jala),#818cf8);box-shadow:0 8px 22px -6px var(--jala)}
.msw button{position:relative;z-index:1;display:flex;gap:.4rem;align-items:center;justify-content:center;min-width:7.4rem;padding:.55rem 1rem;border-radius:99px;font-weight:800;font-size:.9rem;color:var(--mut);transition:color .3s}
.msw[data-m="on"] button[data-m="on"],.msw[data-m="off"] button[data-m="off"]{color:#fff}
.mp{display:none!important}
.wave{position:fixed;z-index:9990;width:20px;height:20px;margin:-10px;border-radius:50%;pointer-events:none;transform:scale(0);transition:transform .65s cubic-bezier(.5,0,.2,1)}.wave.go{transform:scale(260)}
.btn,.btn2,.opt,.chip{position:relative;overflow:hidden}
.rpl{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.42);transform:scale(0);animation:rpl .65s ease-out forwards}@keyframes rpl{to{transform:scale(1);opacity:0}}
.gc{will-change:transform}
.gc:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-5px)!important}
.gc::after{display:block!important;content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)!important}.gc:hover::after{opacity:1!important}
.gc .ic{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.gc:hover .ic{transform:scale(1.18) rotate(-8deg)}.gc .pl{transition:letter-spacing .25s}.gc:hover .pl{letter-spacing:.06em}
.gc{animation-delay:calc(var(--k,0)*70ms)}
.pg{animation:vin .45s ease both}
#st>div{animation:sup .3s cubic-bezier(.2,.9,.3,1),glow 3s ease-in-out .3s infinite alternate!important}
@keyframes glow{to{box-shadow:0 30px 90px -18px var(--c,var(--brand))}}
#st>div.urgent #tm{color:var(--agni);animation:tick 1s ease-in-out infinite}#st>div.urgent .tbar i{background:var(--agni)!important}
@keyframes tick{50%{transform:scale(1.35)}}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.mk::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a),var(--c),transparent 28%,var(--akasha) 55%,transparent 80%,var(--c));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none}
.mk{position:relative}@keyframes spin{to{--a:360deg}}
#lbt tr:nth-child(1) td{background:linear-gradient(100deg,color-mix(in srgb,#f5b83d 28%,var(--card)),var(--card) 50%,color-mix(in srgb,#f5b83d 28%,var(--card)));background-size:240% 100%;animation:shim 3s ease-in-out infinite alternate}
#lbt tr:nth-child(1){animation:vin .45s ease both;animation-delay:45ms}#lbt tr:nth-child(2){animation:vin .45s ease both;animation-delay:90ms}#lbt tr:nth-child(3){animation:vin .45s ease both;animation-delay:135ms}#lbt tr:nth-child(4){animation:vin .45s ease both;animation-delay:180ms}#lbt tr:nth-child(5){animation:vin .45s ease both;animation-delay:225ms}#lbt tr:nth-child(6){animation:vin .45s ease both;animation-delay:270ms}#lbt tr:nth-child(7){animation:vin .45s ease both;animation-delay:315ms}#lbt tr:nth-child(8){animation:vin .45s ease both;animation-delay:360ms}#lbt tr:nth-child(9){animation:vin .45s ease both;animation-delay:405ms}#lbt tr:nth-child(10){animation:vin .45s ease both;animation-delay:450ms}

/* ===== Pancha Bhoota game layer ===== */
.tile{font-size:1.7rem;display:grid;place-items:center}
.tile.lit{background:var(--lc,var(--prithvi))}
.spark{display:grid;place-items:center;font-size:1.6rem}
.pad{font-size:2.2rem;display:grid;place-items:center}.p4{background:var(--akasha)}
.card{white-space:pre-line}
.bub{width:56px;height:56px;font-size:1.7rem;display:grid;place-items:center;background:radial-gradient(circle at 30% 28%,color-mix(in srgb,#fff 45%,var(--bc,var(--vayu))),var(--bc,var(--vayu)) 62%)}
.chp{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .8rem;border:2px solid var(--edge);border-radius:99px;background:color-mix(in srgb,var(--c) 24%,var(--card));font-weight:700}.chp i{font-style:normal;font-size:1.4rem}
.dots{display:flex;gap:.45rem;justify-content:center}.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--edge)}.dots i.on{background:var(--vayu)}
.leg{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-bottom:.6rem}.leg span{padding:.15rem .65rem;border:2px solid var(--edge);border-radius:99px;background:var(--card);font-size:1.15rem}.leg b{margin-left:.4rem}.ei{font-style:normal}
.em{position:absolute;font-style:normal;font-size:1.5rem;line-height:1}

/* ===================================================================
   v6 GAME GRAPHICS — glossy gems, 3D flip cards, glowing orbs,
   fireballs, glass bubbles, starfield stages, particle bursts
   =================================================================== */
:root{--stage1:#1a2358;--stage2:#090d24;--glass:rgba(255,255,255,.14)}

/* ---------- Game window ---------- */
#st>div{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--brand)) 10%,var(--card)),var(--card) 38%)!important;overflow:auto}
